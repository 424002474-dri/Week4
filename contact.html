<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Me</title>

    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        nav {
            margin-bottom: 20px;
        }

        nav a {
            color: #90caf9;
            text-decoration: none;
            margin-right: 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: white;
        }

        h1 {
            color: white;
        }

        input, textarea {
            width: 300px;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: none;
            border-radius: 5px;
            background-color: #1f1f1f;
            color: white;
        }

        input[type="submit"] {
            background-color: #90caf9;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: white;
        }
    </style>

</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="contact.html">Contact</a>
    </nav>

    <h1>Contact Me</h1>

    <form>
        <label>Name:</label><br>
        <input type="text"><br>

        <label>Email:</label><br>
        <input type="email"><br>

        <label>Message:</label><br>
        <textarea rows="5"></textarea><br>

        <input type="submit" value="Send">
    </form>

</body>
</html>
